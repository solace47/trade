name: 历史行情分片验证

on:
  workflow_dispatch:
    inputs:
      limit_symbols:
        description: 每个分片最多处理的股票数，0 表示全部
        required: true
        default: '10'
        type: number
      max_shards:
        description: 本次运行的分片数，最多 20
        required: true
        default: '1'
        type: number

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - id: matrix
        env:
          SHARD_COUNT: ${{ inputs.max_shards }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          count = int(os.environ['SHARD_COUNT'])
          if not 1 <= count <= 20:
              raise ValueError('max_shards must be between 1 and 20')
          print('shards=' + json.dumps(list(range(count))))
          PY
  research:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/ci_market_shard.py --shard ${{ matrix.shard }} --shards 20 --limit-symbols ${{ inputs.limit_symbols }}
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
